[theme]
name = "wedding"
version = "0.1.0"
api_version = 1
fonts = []
assets = ["assets/botanical.svg", "assets/wildflower.svg", "assets/vine.svg", "assets/bow.svg", "assets/minimal.svg"]
stylesheet = "theme.css.tmpl"
print_stylesheet = "print.css.tmpl"
output_targets = ["html", "pdf"]
modules = ["scientific-data"]
slide_variants = ["claim", "figure", "comparison", "derivation", "section-title", "dense"]
palette_parameter = "variant"
feature_hooks = ["code-reveal", "fit-text", "footer", "slide-classes", "speaker-notes"]

[presets.spotlight]
variant = "claim"
classes = ["lead"]
transition = "fade"

[presets.spotlight.theme_params]
accent = "#7895a3"

[parameters.variant]
type = "enum"
default = "garden"
values = ["garden", "ivory", "slate-rose"]

[parameters.ornament_style]
type = "enum"
default = "botanical"
values = ["botanical", "wildflower", "vine", "bow", "minimal"]

[parameters.background]
type = "color"
default = "#f1eee8"

[parameters.surface]
type = "color"
default = "#fffdf8"

[parameters.text]
type = "color"
default = "#252522"

[parameters.muted]
type = "color"
default = "#6f746d"

[parameters.accent]
type = "color"
default = "#7895a3"

[parameters.accent_alt]
type = "color"
default = "#6f826e"

[parameters.rule]
type = "color"
default = "#d8d0c5"

[parameters.density]
type = "enum"
default = "normal"
values = ["compact", "normal", "spacious"]

[parameters.pile_scale]
type = "number"
default = 0.92
min = 0.88
max = 0.96

[parameters.footer]
type = "enum"
default = "slide-number"
values = ["none", "slide-number", "section-title", "section-progress"]

[parameters.font_heading]
type = "font"
default = '"Didot", "Bodoni 72", "Iowan Old Style", Georgia, serif'

[parameters.font_body]
type = "font"
default = '"Avenir Next", Aptos, "Segoe UI", ui-sans-serif, sans-serif'

[parameters.font_mono]
type = "font"
default = '"SFMono-Regular", Menlo, Consolas, ui-monospace, monospace'

[parameters.font_script]
type = "font"
default = '"Snell Roundhand", "Apple Chancery", "Segoe Script", cursive'

[color_variants.garden]
background = "#f1eee8"
surface = "#fffdf8"
text = "#252522"
muted = "#6f746d"
accent = "#7895a3"
accent_alt = "#6f826e"
rule = "#d8d0c5"

[color_variants.ivory]
background = "#f3eee8"
surface = "#fffaf3"
text = "#26231f"
muted = "#746b62"
accent = "#a25d68"
accent_alt = "#806b45"
rule = "#dfd2c1"

[color_variants.slate-rose]
background = "#e8e5df"
surface = "#fffdf8"
text = "#20242a"
muted = "#626a70"
accent = "#934b60"
accent_alt = "#3f6f71"
rule = "#ccd2d0"

[style]
family = "wedding-editorial"
inspiration = []
