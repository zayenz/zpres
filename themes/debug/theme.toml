[theme]
name = "debug"
version = "0.1.0"
api_version = 1
fonts = []
assets = []
stylesheet = "theme.css.tmpl"
print_stylesheet = "print.css.tmpl"
output_targets = ["html", "pdf"]
modules = ["scientific-data"]
slide_variants = ["claim", "figure", "comparison", "derivation", "section-title", "dense"]
feature_hooks = ["autoscale", "detail-slides", "footer", "footnotes", "list-reveal", "slide-presets", "speaker-notes", "steps-final-state", "transitions"]

[presets.spotlight]
variant = "claim"
classes = ["lead"]
autoscale = true
transition = "fade"

[presets.spotlight.theme_params]
accent = "#155e75"

[parameters.accent]
type = "color"
default = "#155e75"

[parameters.accent_alt]
type = "color"
default = "#7c3aed"

[parameters.background]
type = "color"
default = "#e2e8f0"

[parameters.surface]
type = "color"
default = "#f8fafc"

[parameters.text]
type = "color"
default = "#0f172a"

[parameters.muted]
type = "color"
default = "#475569"

[parameters.rule]
type = "color"
default = "#94a3b8"

[parameters.font_heading]
type = "font"
default = 'ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace'

[parameters.font_body]
type = "font"
default = 'Inter, Aptos, "Segoe UI", ui-sans-serif, sans-serif'

[parameters.font_mono]
type = "font"
default = '"SFMono-Regular", Menlo, Consolas, monospace'
