[theme]
name = "paper-chalk"
version = "0.1.0"
api_version = 1
fonts = []
assets = []
stylesheet = "theme.css.tmpl"
print_stylesheet = "print.css.tmpl"
output_targets = ["html", "pdf"]
modules = ["scientific-data"]
slide_variants = ["claim", "figure", "comparison", "derivation", "section-title", "dense"]
palette_parameter = "mode"
feature_hooks = ["code-reveal", "fit-text", "footer", "speaker-notes"]

[presets.spotlight]
variant = "claim"
classes = ["lead"]
autoscale = true
transition = "fade"

[presets.spotlight.theme_params]
accent = "#2f6f66"

[parameters.mode]
type = "enum"
default = "light"
values = ["light", "dark"]

[parameters.background]
type = "color"
default = "#f4f0e6"

[parameters.surface]
type = "color"
default = "#fffdf4"

[parameters.text]
type = "color"
default = "#162b4d"

[parameters.muted]
type = "color"
default = "#526783"

[parameters.accent]
type = "color"
default = "#1e4f9a"

[parameters.accent_alt]
type = "color"
default = "#a4475a"

[parameters.rule]
type = "color"
default = "#c9d7e6"

[parameters.density]
type = "enum"
default = "normal"
values = ["compact", "normal", "spacious"]

[parameters.footer]
type = "enum"
default = "slide-number"
values = ["none", "slide-number", "section-progress"]

[parameters.font_heading]
type = "font"
default = '"Avenir Next Condensed", "Arial Narrow", "Aptos Display", ui-sans-serif, sans-serif'

[parameters.font_body]
type = "font"
default = '"Avenir Next", Aptos, "Segoe UI", ui-sans-serif, sans-serif'

[parameters.font_mono]
type = "font"
default = '"SFMono-Regular", Menlo, Consolas, ui-monospace, monospace'

[color_variants.light]
background = "#f4f0e6"
surface = "#fffdf4"
text = "#162b4d"
muted = "#526783"
accent = "#1e4f9a"
accent_alt = "#a4475a"
rule = "#c9d7e6"

[color_variants.dark]
background = "#101a22"
surface = "#16232b"
text = "#f4f0df"
muted = "#b9c3c7"
accent = "#82afe8"
accent_alt = "#d88799"
rule = "#415766"

[style]
family = "field-notebook"
inspiration = []
