<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">Imported search-node profile</title>
  <desc id="desc">A paper-style line chart compares search nodes before and after propagation across four instance sizes. The resolved after-propagation series uses dark ochre square markers and is lower at every size.</desc>
  <rect width="960" height="480" fill="#ffffff"/>
  <g transform="translate(150 36)">
    <g fill="none" stroke="#d5d9dc" stroke-width="2">
      <path d="M0 0H760M0 78H760M0 156H760M0 234H760M0 312H760"/>
    </g>
    <path d="M0 0V312H760" fill="none" stroke="#27323a" stroke-width="4"/>
    <g fill="#27323a" font-family="Aptos, Segoe UI, sans-serif" font-size="34" font-weight="650">
      <text x="-54" y="320">0</text>
      <text x="-80" y="242">800</text>
      <text x="-92" y="164">1,600</text>
      <text x="-92" y="86">2,400</text>
      <text x="-92" y="8">3,200</text>
      <g text-anchor="middle">
        <text x="20" y="358">n=20</text>
        <text x="260" y="358">n=40</text>
        <text x="500" y="358">n=60</text>
        <text x="740" y="358">n=80</text>
      </g>
      <text x="380" y="424" text-anchor="middle">candidate variables</text>
      <text transform="translate(-120 244) rotate(-90)">search nodes</text>
    </g>
    <path d="M20 283L260 244L500 156L740 50" fill="none" stroke="#465965" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#ffffff" stroke="#465965" stroke-width="6">
      <circle cx="20" cy="283" r="10"/><circle cx="260" cy="244" r="10"/><circle cx="500" cy="156" r="10"/><circle cx="740" cy="50" r="10"/>
    </g>
    <path d="M20 300L260 291L500 274L740 264" fill="none" stroke="#8a5a00" stroke-width="8" stroke-linecap="square" stroke-linejoin="round"/>
    <g fill="#8a5a00">
      <rect x="11" y="291" width="18" height="18"/><rect x="251" y="282" width="18" height="18"/><rect x="491" y="265" width="18" height="18"/><rect x="731" y="255" width="18" height="18"/>
    </g>
    <g font-family="Aptos, Segoe UI, sans-serif" font-size="32" font-weight="750">
      <text x="390" y="28" fill="#465965">before propagation</text>
      <text x="430" y="236" fill="#8a5a00">after propagation</text>
    </g>
  </g>
</svg>
