name: Publish to crates.io

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Select the release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Expected a stable release tag such as v0.1.0" >&2
            exit 1
          }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify the package version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          package_id=$(cargo pkgid --locked)
          version=${package_id##*#}
          version=${version##*@}
          test "$version" = "$RELEASE_VERSION"

      - name: Check whether the version is already published
        id: registry
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://index.crates.io/zp/re/zpres > "$RUNNER_TEMP/zpres-index"
          if jq -e --arg version "$RELEASE_VERSION" 'select(.vers == $version)' "$RUNNER_TEMP/zpres-index" > /dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "zpres $RELEASE_VERSION is already on crates.io"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the Cargo package
        if: steps.registry.outputs.published != 'true'
        run: cargo publish --locked --dry-run

      - name: Authenticate with crates.io
        if: steps.registry.outputs.published != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish the Cargo package
        if: steps.registry.outputs.published != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
